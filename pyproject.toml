[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "room-hvac-sim"
version = "0.1.0"
description = "Dynamic room model (temperature and humidity) for testing HVAC control strategies"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Wojciech Kulozik"}]
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "ziglang>=0.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "NPY", "PL", "RUF", "N", "D"]
ignore = [
    "PLR0913",  # physical models legitimately take many parameters
    "PLR2004",  # numeric constants in physics code are documented where defined
    "N802", "N803", "N806", "N815", "N816",  # symbol names follow the physics notation (T_a, UA, Q_lat)
    "RUF001", "RUF002", "RUF003",  # Greek letters and units in strings and comments are intended
    "D105", "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR0915", "PLR0912"]
"scripts/*" = ["D103"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "scripts"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*"]
ignore_missing_imports = true
